# Save this as .streamlit/secrets.toml locally.
# In Streamlit Community Cloud, paste these values into App settings > Secrets.
# Never commit this file or your service-account private key to GitHub.

[google_sheets]
spreadsheet_id = "PASTE_YOUR_SPREADSHEET_ID_HERE"
worksheet_name = "Tickets"
google_form_url = "https://docs.google.com/forms/d/e/PASTE_YOUR_FORM_ID/viewform"

[columns]
# Replace these with the exact column headers in your Tickets worksheet.
ticket_id = "Ticket_ID"
status = "Status"
category = "Category"
severity = "Severity"
location = "Location"
submitted_at = "Timestamp"
summary = "Summary"
resolution_note = "Resolution_Note"

[gcp_service_account]
type = "service_account"
project_id = "PASTE_PROJECT_ID"
private_key_id = "PASTE_PRIVATE_KEY_ID"
private_key = """-----BEGIN PRIVATE KEY-----
PASTE_PRIVATE_KEY_CONTENT_HERE
-----END PRIVATE KEY-----\n"""
client_email = "PASTE_SERVICE_ACCOUNT_EMAIL"
client_id = "PASTE_CLIENT_ID"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "PASTE_CLIENT_CERTIFICATE_URL"
universe_domain = "googleapis.com"
